pull_request_rules:
  - name: Automatic merge for Dependabot pull requests
    conditions:
      - author=dependabot[bot]
      # Require the checks to have actually passed; `#check-failure=0` also
      # matches while checks are still pending, which let a breaking bump merge.
      - check-success=Lint
      - check-success=MSRV
      - check-success=Tests
    actions:
      merge:
        method: merge

  - name: Automatic update to the main branch for pull requests
    conditions:
      - -conflict # skip PRs with conflicts
      - -draft # skip GH draft PRs
      - -author=dependabot[bot] # skip dependabot PRs
    actions:
      update:
